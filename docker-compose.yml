version: '3.8'

services:
  # ── PostgreSQL Database ───────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: naghanish_db
    restart: always
    environment:
      POSTGRES_USER: naghanish_user
      POSTGRES_PASSWORD: naghanish_secret_password
      POSTGRES_DB: naghanish_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naghanish_user -d naghanish_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis (For WebSocket / Realtime Room State / Caching) ─────────────────
  redis:
    image: redis:7-alpine
    container_name: naghanish_redis
    restart: always
    ports:
      - "6379:6379"

  # ── FastAPI Backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: naghanish_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://naghanish_user:naghanish_secret_password@postgres:5432/naghanish_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=naghanish_super_secret_key_change_in_production
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # ── React Frontend (Nginx Served) ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: naghanish_frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
